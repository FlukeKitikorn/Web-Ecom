name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Install nodeJS fot lint
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      - name: Lint Javascript
        run: npm run lint:js
      - name: Lint HTML 
        run: npm run lint:html
  
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Install nodeJS fot lint
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      - name: Security Audit
        run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Install nodeJS fot lint
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Example for test
        run: echo "Testing...." 

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t my-static-web .
      - name: Run container (test)
        run: docker run -d -p 8080:80 my-static-web
