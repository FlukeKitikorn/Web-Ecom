name: CI

on:
  push:
    branches: [ "main" ]

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Install nodeJS fot lint
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      - name: Lint Javascript
        run: npm run lint:js
      - name: Lint HTML 
        run: npm run lint:html
  
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Install nodeJS fot lint
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      - name: Security Audit
        run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Install nodeJS fot lint
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Example for test
        run: echo "Testing...." 

  build:
    runs-on: ubuntu-latest
    needs: [test, audit]          # รอทั้ง test และ audit ผ่านก่อน
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."    

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4