name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v6
      - name: Install nodeJS fot lint
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - run: npm run lint:js
      - run: npm run lint:html
  
