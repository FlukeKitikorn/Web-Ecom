<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <meta http-equiv="X-UA-Compatible" content="ie=edge" /> -->
    <title>UniQon</title>
    <link rel="shortcut icon" href="./img/logo/android-chrome-512x512.png" type="image/x-icon">
    <!-- styles custom -->
    <link rel="stylesheet" type="text/css" href="./CSS/styles_contact.css" />
  </head>
  <body>
    
    <!-- header -->
    <header>
      <nav>
        <a href="index.html" id="logo"><i class="fa-solid fa-shirt"></i><span>UniQon</span></a>
  
        <ul class="navbar-left">
          <li><a id="hover-line" href="index.html">Home</a></li>
          <li><a id="hover-line" href="shop.html" target="_self">Shop</a></li>
          <li><a id="hover-line" href="about.html" target="_self">About</a></li>
          <li><a id="hover-line" class="active" href="contact.html" target="_self">Contact</a></li>
        </ul>

        <div class="navbar-right">
          <!-- cart -->
          <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
          <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
          <div id="ham-menu"><i class="fa-solid fa-bars"></i></div>
        </div>
      </nav>
    </header>

    <main>
      <!-- form -->
      <section>
        <h2 id="text_head" style="margin-top: 10px; margin-bottom: 20px; "><span id="sub">Contact Us</span></h2>
        <div class="container_content">
          <div class="container_contact-box">
            <!-- picture -->
            <div class="box-left"></div>
            <!-- form -->
            <div class="box-right">
              <h2>Contact Us</h2>
              <input id="name" type="text" class="filed" style="margin-bottom: 22px;" placeholder="Your name">
              <input id="mail" type="email" class="filed" style="margin-bottom: 22px;" placeholder="Your email">
              <input id="phone" type="text" class="filed" style="margin-bottom: 22px;" placeholder="Your Phone">
              <textarea id="message" class="filed area" placeholder="Message" oninput="countCharacters()"></textarea>
              <p id="charCount">0/100</p>
              <button class="btn" onclick="Submit()">Send</button>
            </div>
          </div>
        </div>
      </section>
      <!-- newsletter -->
      <section id="news">
        <h2 id="text_head" style="margin-top: 20px; margin-bottom: 50px; "><span id="sub">New Subscribe to our Newsletter</span></h2>
        <div class="box_new">
          <form action="#">
            <div class="form_box">
                <input type="text" name="EmailAddress" placeholder="Enter your">
                <button type="submit">Subscribe</button>
            </div>
          </form>
        </div>
      </section>
      <!-- Map -->
      <section style="margin-top: 10px;">
        <div class="container_map">
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3875.676814566031!2d100.62581417587225!3d13.73800618665238!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x311d61d1a42ccfa5%3A0xd5edaf32927b6846!2z4Liq4LiW4Liy4Lia4Lix4LiZ4LmA4LiX4LiE4LmC4LiZ4LmC4Lil4Lii4Li14LmE4LiX4LiiLeC4jeC4teC5iOC4m-C4uOC5iOC4mQ!5e0!3m2!1sth!2sth!4v1708239945463!5m2!1sth!2sth" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </section>
    </main>

        <!-- footer -->
        <div class="footer">
          <div class="container">
            <div class="row">
              <div class="footer-col">
                <h4>COMPANY</h4>
                <ul>
                  <li><a href="about.html#About">about us</a></li>
                  <li><a href="about.html#Service">our service</a></li>
                  <li><a href="about.html#Teams" >our teams</a></li>
                </ul>
              </div>

              <div class="footer-col">
                <h4>NEED HELP?</h4>
                <ul>
                  <li><a href="#text_head">Contact</a></li>
                  <li><a href="#news">Subscribe</a></li>
                </ul>
              </div>

              <div class="footer-col">
                <h4>CATEGORIES</h4>
                <ul>
                  <li><a href="#">Clothes</a></li>
                  <li><a href="#">Sneakers</a></li>
                  <li><a href="#">Accessories</a></li>
                </ul>
              </div>

              <div class="footer-col">
                <h4>FOLLOW US</h4>
                <div class="social-links">
                  <a href="#"><i class="fa-brands fa-square-facebook"></i></a>
                  <a href="#"><i class="fa-brands fa-twitter"></i></a>
                  <a href="#"><i class="fa-brands fa-google-plus-g"></i></a>
                </div>
              </div>
            </div>
          </div>
    </div>

    <!-- Font awesome -->
    <script src="https://kit.fontawesome.com/33742628d2.js" crossorigin="anonymous"></script>
    <!-- js event -->
    <script src="./JS/script.js">
    </script>
  </body>
</html>
